<?xml version="1.0" encoding="UTF-8"?>
<svg width="260" height="260" viewBox="0 0 260 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.16"/>
    </filter>

    <g id="dumpling">
      <!-- asymmetric top-view dumpling so tumble reads like the video -->
      <path d="M-18 -8
               C-20 -1 -18 8 -10 14
               C-1 20 12 17 18 10
               C24 3 23 -8 15 -14
               C7 -20 -3 -20 -11 -16
               C-15 -14 -17 -12 -18 -8Z"
            fill="#F7F0D9"/>
      <path d="M-14 -6
               C-15 0 -14 6 -8 10
               C-2 14 8 13 13 8
               C18 3 18 -6 12 -10
               C6 -14 -2 -14 -8 -11
               C-11 -10 -13 -8 -14 -6Z"
            fill="#FFF9E9" opacity="0.92"/>
      <path d="M-3 -13
               C1 -11 5 -10 8 -7"
            stroke="#E6D4AE" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/>
      <path d="M-9 -9 C-7 -8 -5 -7 -3 -5
               M-5 -11 C-2 -9 0 -7 1 -4
               M0 -12 C3 -10 5 -8 7 -5"
            stroke="#E0CAA1" stroke-width="1.7" stroke-linecap="round" opacity="0.88"/>
      <ellipse cx="-2" cy="-4" rx="10" ry="6" fill="#FFFFFF" opacity="0.2"/>
    </g>
  </defs>

  <g id="spinner" transform="translate(130 130)">
    <!-- slow circular flow, like the actual pot -->
    <animateTransform attributeName="transform" type="rotate"
      values="0;360" dur="3.9s" repeatCount="indefinite" additive="sum"/>


    <g transform="rotate(-90.0000)">
      <g transform="translate(0 -73)">
        <!-- boiling drift -->
        <g>
          <animateTransform attributeName="transform" type="translate"
            values="0 0; 1.5 -2.5; -1 2; 0 0"
            dur="1.05s" begin="0.00s" repeatCount="indefinite"/>
          <!-- tiny local orbital wiggle -->
          <animateTransform attributeName="transform" additive="sum" type="rotate"
            values="-8;6;-5;0;-8"
            dur="1.70s" begin="0.00s" repeatCount="indefinite"/>
          <!-- dumpling keeps tangent to circle, only gently tumbles instead of propeller-spin -->
          <g transform="rotate(90)">
            <g>
              <animateTransform attributeName="transform" type="rotate"
                values="-10;16;-8;-10"
                dur="1.25s" begin="0.00s" repeatCount="indefinite"/>
              <animateTransform attributeName="transform" additive="sum" type="scale"
                values="1 1;1.05 0.95;0.96 1.04;1 1"
                dur="1.02s" begin="0.00s" repeatCount="indefinite"/>
              <g filter="url(#shadow)">
                <use href="#dumpling"/>
              </g>
            </g>
          </g>
        </g>
      </g>
    </g>

    <g transform="rotate(-38.5714)">
      <g transform="translate(0 -73)">
        <!-- boiling drift -->
        <g>
